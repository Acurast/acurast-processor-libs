[package]
name = "acurast-rust-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.51"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.4", features = ["blocking"] }
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
byteorder = "1.4"
blake2 = "0.10.6"
hex = "0.4"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2.19"
lazy_static = "1.4.0"
uniffi = { version = "0.29.4", features = ["tokio"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2.0.12"

[build-dependencies]
uniffi = { version = "0.29.4", features = ["build", "tokio"] }

[lib]
crate-type = ["staticlib", "lib"]
name = "acurastsdk"
