# Android library com.github.acurast:acurast-processor-libs:<tag>, built by JitPack from GitHub.
before_install:
  - sdk install java 17.0.9-tem
  - sdk use java 17.0.9-tem
  - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O android-commandlinetools.zip && unzip -q android-commandlinetools.zip -d ${ANDROID_HOME} && rm android-commandlinetools.zip
  - yes | ${ANDROID_HOME}/cmdline-tools/bin/sdkmanager --sdk_root=${ANDROID_HOME} --licenses > /dev/null
  - ${ANDROID_HOME}/cmdline-tools/bin/sdkmanager --sdk_root=${ANDROID_HOME} "ndk;29.0.14206865" "cmake;3.22.1"
  # Rust with the version and targets of rust-toolchain.toml.
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
  - source $HOME/.cargo/env
  - rustup show
install:
  - echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
  - cd android && ./gradlew :lib:publishToMavenLocal
