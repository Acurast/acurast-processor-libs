[package]
name = "acurast-rust-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.51"
serde_json = "1.0"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking"] }
xxhash-rust = {version = "0.8", features = ["xxh3"]}
byteorder = "1.4"
blake2 = "0.9"
hex = "0.4"
num-bigint = "0.4"